    <button id="botaoAudio" class="botaoAudio" onclick="ligarAudio()">▶︎</button>
  </div>

<audio id="meuAudio" src="../assets/audioestrofe5.mp3"></audio>

<script>
  const audio = document.getElementById("meuAudio");
  const botao = document.getElementById("botaoAudio");

  function ligarAudio() {
    if (audio.paused) {
      audio.play();
      botao.textContent = "⏸︎";
    } else {
      audio.pause();
      botao.textContent = "▶︎";
    }
  }
</script>

</body>
