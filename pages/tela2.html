<audio id="meuAudio" src="../assets/audiosestrofe1e2.mp3"></audio>
<button id="botaoAudio" class="botaoAudio" onclick="alternarSom()">▶︎</button>

<script>
  const audio = document.getElementById("meuAudio");
  const botao = document.getElementById("botaoAudio");

  function alternarSom() {
    if (audio.paused) {
      audio.play();
      botao.textContent = "⏸︎";
    } else {
      audio.pause();
      botao.textContent = "▶︎";
    }
  }
</script>
